  <script>
const D = window.AOL_DATA;
const places = D.places;
const curations = D.curations;
const curationPlaces = D.curation_places;
const works = D.works;
const schedules = D.schedules;
const sources = D.sources;

const state = {
  page: 'home',
  selectedPlace: null,
  selectedCuration: null,
  category: '전체',
  freeOnly: false
};

const store = {
  saved: new Set(JSON.parse(localStorage.getItem('aol_saved') || '[]')),
  visited: JSON.parse(localStorage.getItem('aol_visited') || '{}'),
  sync(){
    localStorage.setItem('aol_saved', JSON.stringify([...this.saved]));
    localStorage.setItem('aol_visited', JSON.stringify(this.visited));
  }
};

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const placeById = id => places.find(p => p.place_id === id);

function badge(p){
  const free = p.free ? '<span class="badge">무료</span>' : '<span class="badge violet">유료/조건부</span>';
  return `${free}<span class="badge violet">${esc(p.primary_category)}</span>`;
}

function visual(){ return `<div class="visual"></div>`; }

function placeCard(p){
  return `<button class="place-card" data-place="${p.place_id}">
    ${visual()}
    <div class="card-body">${badge(p)}<h3>${esc(p.name_kr)}</h3>
      <div class="meta">${esc(p.district)} · ${esc(p.typical_hours || '운영정보 확인')}</div>
    </div>
  </button>`;
}

function listCard(p, extra=''){
  return `<button class="list-card" data-place="${p.place_id}">
    <div class="thumb"></div>
    <div><h3>${esc(p.name_kr)}</h3><div class="meta">${esc(p.primary_category)} · ${esc(p.district)}</div>
    <div class="small">${extra || esc(p.short_description || '')}</div></div>
    <div class="arrow">›</div>
  </button>`;
}

function renderHome(){
  const featured = places.filter(p => p.MVP_priority === 'A').slice(0,10);
  const now = places.filter(p => ['active','active_rotation','active_display','active_event'].includes(p.status)).slice(0,8);
  return `
    <div class="eyebrow">SEOUL · V0.1</div>
    <h1>도시의 빛을 발견하세요.</h1>

      <button class="cta" data-tonight>오늘 밤 추천 보기 →</button>
    </section>

      <button class="chip" data-quick="free">무료</button>
      <button class="chip" data-quick="indoor">실내</button>
      <button class="chip" data-quick="Media Facade">미디어파사드</button>
      <button class="chip" data-quick="Immersive">몰입형</button>
      <button class="chip" data-quick="Light Art">빛</button>
    </div>
    <div class="section-head"><h2>지금 볼 수 있어요</h2><button data-nav="map">더보기</button></div>
    <div class="hscroll">${now.map(placeCard).join('')}</div>

    <div class="hscroll">${featured.map(placeCard).join('')}</div>
    <div class="section-head"><h2>이번 주 큐레이션</h2><button data-nav="curation">전체</button></div>
    <div class="list">${curations.slice(0,3).map(c => `
      <button class="curation-card" data-curation="${c.curation_id}">
        <div class="eyebrow">${esc(c.theme || 'CURATION')}</div><h3>${esc(c.title)}</h3>
        <div class="muted">${esc(c.subtitle || '')}</div>
      </button>`).join('')}</div>`;
}

function renderMap(){
  let filtered = places;
  if(state.category !== '전체') filtered = filtered.filter(p => p.primary_category === state.category);
  if(state.freeOnly) filtered = filtered.filter(p => p.free);
  const pins = [[22,30],[50,25],[75,35],[35,52],[62,58],[18,72],[82,75],[48,82]]
    .map((a,i)=>`<span class="mock-pin" style="left:${a[0]}%;top:${a[1]}%"></span>`).join('');
  return `
    <div class="eyebrow">EXPLORE</div><h1>지도</h1>
    <div class="chips">
      ${['전체','Media Facade','Media Art','Immersive','Light Art','Architecture'].map(x =>
        `<button class="chip ${state.category===x?'active':''}" data-category="${x}">${x==='전체'?'전체':x}</button>`).join('')}
      <button class="chip ${state.freeOnly?'active':''}" data-free>무료</button>
    </div>
    <div class="map-shell" style="margin-top:12px">${pins}</div>
    <div class="notice" style="margin-top:10px">
      현재 Seed 데이터는 정확하지 않은 좌표를 임의 생성하지 않았다. 실제 지도 핀은 Geocoding 검증 후 활성화된다.
      지금 프로토타입에서는 장소 카드의 <b>지도 검색</b>으로 실제 주소를 확인할 수 있다.
    </div>
    <div class="section-head"><h2>장소 ${filtered.length}</h2><span class="small muted">${esc(state.category)}</span></div>
    <div class="list">${filtered.slice(0,30).map(p=>listCard(p)).join('')}</div>`;
}

function renderDetail(p){
  const pw = works.filter(w=>w.place_id===p.place_id);
  const ps = schedules.filter(s=>s.place_id===p.place_id);
  const src = sources.filter(s=>s.place_id===p.place_id);
  const saved = store.saved.has(p.place_id);
  const visited = store.visited[p.place_id] || 0;
  const mapUrl = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(p.address || p.name_kr);
  return `
    <div class="detail-head"><div class="cover"></div></div>
    <div class="detail-content">
      <div class="detail-title"><div><div class="eyebrow">${esc(p.primary_category)} · ${esc(p.district)}</div><h1>${esc(p.name_kr)}</h1><div class="muted">${esc(p.name_en || '')}</div></div>
        <button class="round-action" data-save="${p.place_id}" aria-label="저장">${saved?'♥':'♡'}</button>
      </div>
      <p>${esc(p.short_description)}</p>
      <div style="display:flex;gap:8px"><button class="cta secondary" data-visit="${p.place_id}">✓ 방문했어요${visited?` · ${visited}`:''}</button>
      <a class="cta" style="text-decoration:none" target="_blank" href="${mapUrl}">지도 검색</a></div>

      <h2>이곳을 추천하는 이유</h2>
      <p class="quote">${esc(p.why_it_matters)}</p>

      <div class="info-grid">
        <div class="info"><strong>위치</strong>${esc(p.district)}</div>
        <div class="info"><strong>운영</strong>${esc(p.typical_hours || '확인 필요')}</div>
        <div class="info"><strong>관람료</strong>${p.free?'무료':'유료/조건부'}</div>
        <div class="info"><strong>추천시간</strong>${esc(p.recommended_time || '상시')}</div>
      </div>

      <h2>빛의 건축 해설</h2><p>${esc(p.expert_description || p.description)}</p>
      <h2>현재 프로그램</h2><p>${esc(p.current_program || '최신 편성 확인 필요')}</p>
      ${pw.length?`<h2>작품 / 전시</h2><div class="list">${pw.map(w=>`<div class="info"><strong>${esc(w.title)}</strong><span class="small muted">${esc(w.artist||'')} · ${esc(w.media||'')}</span><p>${esc(w.description||'')}</p></div>`).join('')}</div>`:''}
      ${ps.length?`<h2>관람 정보</h2>${ps.map(s=>`<div class="info" style="margin-bottom:8px"><strong>${esc(s.day_of_week)}</strong>${esc(s.open_time||'')} ${s.close_time?'– '+esc(s.close_time):''}<div class="small muted">${esc(s.note||'')}</div></div>`).join('')}`:''}
      <h2>출처</h2>
      ${src.map(s=>`<p class="source">${esc(s.publisher)} · <a class="link" target="_blank" href="${esc(s.url)}">검증 출처 열기</a></p>`).join('')}
      ${p.website?`<a class="cta full" target="_blank" href="${esc(p.website)}">공식 사이트 / 원문 보기</a>`:''}
    </div>`;
}

function renderCuration(){
  return `<div class="eyebrow">CURATED JOURNEYS</div><h1>큐레이션</h1><p class="muted">테마로 만나는 특별한 빛의 여정.</p>
  <div class="chips"><button class="chip active">전체</button><button class="chip">지역</button><button class="chip">테마</button><button class="chip">에디터</button></div>
  <div class="list" style="margin-top:15px">${curations.map(c=>`
    <button class="curation-card" data-curation="${c.curation_id}">
      <div class="eyebrow">${esc(c.city)} · ${esc(c.estimated_time)}</div><h3>${esc(c.title)}</h3>
      <div>${esc(c.subtitle||'')}</div><div class="small muted" style="margin-top:9px">${esc(c.description||'')}</div>
    </button>`).join('')}</div>`;
}

function renderCurationDetail(c){
  const links = curationPlaces.filter(x=>x.curation_id===c.curation_id).sort((a,b)=>(a.order||0)-(b.order||0));
  return `<button class="chip" data-back="curation">← 큐레이션</button>
  <div class="eyebrow" style="margin-top:18px">${esc(c.city)} · ${esc(c.estimated_time)}</div><h1>${esc(c.title)}</h1>
  <p class="muted">${esc(c.subtitle||'')}</p><p>${esc(c.description||'')}</p>
  <button class="cta full" data-curation-map="${c.curation_id}">지도에서 ${links.length}곳 보기</button>
  <h2>코스</h2><div class="list">${links.map((x,i)=>{
    const p=placeById(x.place_id); return p?listCard(p,`${String(i+1).padStart(2,'0')} · ${esc(x.editor_comment||'')}`):''}).join('')}</div>`;
}

function renderSaved(){
  const list=[...store.saved].map(placeById).filter(Boolean);
  return `<div class="eyebrow">SAVE</div><h1>저장한 장소</h1><p class="muted">가보고 싶은 빛을 모아두세요.</p>
  ${list.length?`<div class="list">${list.map(p=>listCard(p)).join('')}</div>`:`<div class="empty">아직 저장한 장소가 없습니다.<br>장소 상세에서 ♡를 눌러보세요.</div>`}`;
}

function renderMy(){
  const visitedIds=Object.keys(store.visited);
  const visited=visitedIds.map(placeById).filter(Boolean);
  const districts=new Set(visited.map(p=>p.district).filter(Boolean));
  return `<div class="eyebrow">MY LIGHT MAP</div><h1>나의 빛 지도</h1><p class="muted">프로토타입에서는 로그인 대신 이 기기의 localStorage에 기록합니다.</p>
    <div class="stats">
      <div class="stat"><strong>${visited.length}</strong><span>방문</span></div>
      <div class="stat"><strong>${store.saved.size}</strong><span>저장</span></div>
      <div class="stat"><strong>${districts.size}</strong><span>지역</span></div>
    </div>
    <h2>최근 방문</h2>
    ${visited.length?`<div class="list">${visited.map(p=>listCard(p,`방문 ${store.visited[p.place_id]}회`)).join('')}</div>`:`<div class="empty">아직 방문 기록이 없습니다.</div>`}
    <h2>제품 전환 시</h2><div class="notice">Supabase Auth 연결 후 localStorage를 <b>saved_places / visited_places</b>로 교체하면 동일한 UX를 유지할 수 있습니다.</div>`;
}

function setPage(page, payload){
  state.page=page;
  if(page==='detail') state.selectedPlace=payload;
  if(page==='curationDetail') state.selectedCuration=payload;
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.nav===page || (page==='detail'&&b.dataset.nav==='map') || (page==='curationDetail'&&b.dataset.nav==='curation')));
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

function render(){
  let out='';
  if(state.page==='home') out=renderHome();
  if(state.page==='map') out=renderMap();
  if(state.page==='detail') out=renderDetail(state.selectedPlace);
  if(state.page==='curation') out=renderCuration();
  if(state.page==='curationDetail') out=renderCurationDetail(state.selectedCuration);
  if(state.page==='saved') out=renderSaved();
  if(state.page==='my') out=renderMy();
  $('#view').innerHTML=out;
  bind();
}

function bind(){
  document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>setPage(b.dataset.nav));
  document.querySelectorAll('[data-place]').forEach(b=>b.onclick=()=>setPage('detail',placeById(b.dataset.place)));
  document.querySelectorAll('[data-curation]').forEach(b=>b.onclick=()=>setPage('curationDetail',curations.find(c=>c.curation_id===b.dataset.curation)));
  document.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>setPage(b.dataset.back));
  document.querySelectorAll('[data-category]').forEach(b=>b.onclick=()=>{state.category=b.dataset.category;render()});
  const free=$('[data-free]'); if(free) free.onclick=()=>{state.freeOnly=!state.freeOnly;render()};
  const tonight=$('[data-tonight]'); if(tonight) tonight.onclick=()=>{state.page='map';state.freeOnly=false;state.category='전체';render();window.scrollTo(0,0)};
  document.querySelectorAll('[data-quick]').forEach(b=>b.onclick=()=>{
    const q=b.dataset.quick; setPage('map'); 
    if(q==='free') state.freeOnly=true; else if(q!=='indoor') state.category=q;
    render();
  });
  document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.save; store.saved.has(id)?store.saved.delete(id):store.saved.add(id); store.sync(); render();
  });
  document.querySelectorAll('[data-visit]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.visit; store.visited[id]=(store.visited[id]||0)+1; store.sync(); render();
  });
  document.querySelectorAll('[data-curation-map]').forEach(b=>b.onclick=()=>setPage('map'));
}

const dlg=$('#searchDialog'), input=$('#searchInput'), results=$('#searchResults');
$('#searchBtn').onclick=()=>{dlg.showModal();input.focus();showSearch('')};
input.oninput=()=>showSearch(input.value);
function showSearch(q){
  const t=q.trim().toLowerCase();
  const found=places.filter(p=>!t || [p.name_kr,p.name_en,p.district,p.primary_category,p.short_description].some(v=>String(v||'').toLowerCase().includes(t))).slice(0,20);
  results.innerHTML=found.map(p=>listCard(p)).join('');
  results.querySelectorAll('[data-place]').forEach(b=>b.onclick=()=>{dlg.close();setPage('detail',placeById(b.dataset.place))});
}
render();

if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
