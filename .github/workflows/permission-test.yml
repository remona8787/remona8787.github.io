name: explore
on:
  push:
    branches: [ci-permission-test]
    paths: ['explore/wiki-search.mjs']
jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node explore/wiki-search.mjs
      - name: commit result
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add explore/wiki-search.json && git commit -m "discovery result" && git push
